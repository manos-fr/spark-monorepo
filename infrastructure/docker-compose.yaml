version: '3.8'
services:
  postgres:
    image: postgres:14
    restart: on-failure
    network_mode: 'host'
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HASURA_ADMIN_SECRET}
  graphql-engine:
    image: hasura/graphql-engine:v2.11.11
    volumes:
      - ./hasura/migrations:/hasura-migrations
      - ./hasura/metadata:/hasura-metadata
    depends_on:
      - 'postgres'
    restart: on-failure
    network_mode: 'host'
    environment:
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:${HASURA_ADMIN_SECRET}@localhost:5432/postgres
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${HASURA_ADMIN_SECRET}@localhost:5432/postgres
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true' # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_SERVER_PORT: 8082
      ## uncomment next line to set an admin secret
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
volumes:
  db_data:
