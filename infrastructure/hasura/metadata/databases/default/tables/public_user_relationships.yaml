table:
  name: user_relationships
  schema: public
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_id
  - name: supplier
    using:
      foreign_key_constraint_on: supplier_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - owner_id
        - supplier_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - owner_id
        - supplier_id
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - owner_id
        - supplier_id
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter: {}
