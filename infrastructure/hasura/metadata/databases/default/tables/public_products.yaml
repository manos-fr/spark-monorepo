table:
  name: products
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - user_id
        - category
        - description
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - category
        - description
        - name
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - category
        - description
        - name
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      backend_only: false
      filter: {}
