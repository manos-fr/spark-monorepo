version: '3.8'
services:
  postgres:
    image: postgres:14
    restart: on-failure
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HASURA_ADMIN_SECRET}
  graphql-engine:
    image: hasura/graphql-engine:v2.11.11
    depends_on:
      - 'postgres'
    restart: on-failure
    volumes:
      - ./hasura/migrations:/hasura-migrations
    ports:
      - '8082:8082'
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${HASURA_ADMIN_SECRET}@host.docker.internal:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true' # set to "false" to disable console
      HASURA_GRAPHQL_DEV_MODE: 'true' # enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET} # OMG we should change that!
      HASURA_GRAPHQL_SERVER_PORT: 8082
      HASURA_GRAPHQL_JWT_SECRET: ${HASURA_GRAPHQL_JWT_SECRET}
volumes:
  db_data:
